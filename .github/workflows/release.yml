name: Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    name: "PHP ${{ matrix.php-version }} / Linux ${{ matrix.libc }} / ${{ matrix.thread-safety }}"

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
        libc: [glibc, musl]
        thread-safety: [nts, zts]

    steps:
      - name: Clone
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Install php-extension-builder
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # ratchet:jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: shyim/php-extension-builder
          cache: enable

      # The Linux builder runs inside php-extension-builder's Docker images,
      # which already ship a Rust toolchain plus the clang/libclang that
      # ext-php-rs's bindgen needs, so no extra toolchain setup is required here.
      - name: Build extension
        shell: bash
        run: |
          mkdir -p dist

          zts_args=()
          if [ "${{ matrix.thread-safety }}" = "zts" ]; then
            zts_args+=(--zts)
          fi

          # No --configure-flag: php-extension-builder auto-detects the Rust
          # build kind and compiles via cargo (it does not run ./configure).
          php-extension-builder build \
            --package-version "$GITHUB_REF_NAME" \
            --php-version "${{ matrix.php-version }}" \
            --libc "${{ matrix.libc }}" \
            --out-dir dist \
            "${zts_args[@]}"

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: sasso-php${{ matrix.php-version }}-linux-${{ matrix.libc }}-${{ matrix.thread-safety }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  build-macos:
    runs-on: ${{ matrix.target.runner }}
    name: "PHP ${{ matrix.php-version }} / macOS ${{ matrix.target.arch }} / nts"

    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4", "8.5"]
        target:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64

    steps:
      - name: Clone
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # ratchet:shivammathur/setup-php@2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      # macOS builds run natively, so install the Rust toolchain ourselves.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # ratchet:dtolnay/rust-toolchain@v1

      - name: Install php-extension-builder
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # ratchet:jaxxstorm/action-install-gh-release@v3.0.0
        with:
          repo: shyim/php-extension-builder
          cache: enable

      - name: Build extension
        run: |
          mkdir -p dist

          # ext-php-rs's bindgen needs libclang. Use the libclang that ships
          # inside the active Xcode toolchain rather than a Homebrew LLVM: the
          # PHP/system headers bindgen parses are Xcode's, and mixing a newer
          # Homebrew clang against them fails on SIMD intrinsics (mmintrin.h
          # "__m64" conversion errors).
          export LIBCLANG_PATH="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"

          php-extension-builder build \
            --target-os darwin \
            --package-version "$GITHUB_REF_NAME" \
            --php-version "${{ matrix.php-version }}" \
            --php-config "$(command -v php-config)" \
            --out-dir dist

      - name: Upload package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: sasso-php${{ matrix.php-version }}-darwin-${{ matrix.target.arch }}-nts
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    runs-on: ubuntu-latest
    name: Publish GitHub release
    needs:
      - build-linux
      - build-macos
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          path: packages

      - name: Prepare release assets
        run: |
          mkdir -p dist
          find packages -type f -name '*.zip' -exec cp '{}' dist/ \;
          find dist -type f -name '*.zip' -print | sort | xargs sha256sum > dist/checksums.txt
          ls -lah dist

      - name: Publish release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # ratchet:softprops/action-gh-release@v3.0.1
        with:
          files: |
            dist/*.zip
            dist/checksums.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
