name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    name: "Test · PHP ${{ matrix.php-version }} · ${{ matrix.os }}"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        php-version: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Clone
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Cache only the downloaded crate sources (shareable across PHP versions).
      # The build output (target/) is deliberately NOT cached: it links against
      # version-specific PHP headers via ext-php-rs, and a target/ built for one
      # PHP version reused for another yields a module-API mismatch at load time
      # ("Unable to initialize module ... compiled with module API=...").
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-registry-${{ matrix.os }}-

      # ext-php-rs's bindgen needs libclang. On macOS, point it at Xcode's so
      # the system/PHP headers it parses match the toolchain (mixing a Homebrew
      # clang against Xcode headers fails on SIMD intrinsics). On Linux the
      # runner's libclang is already on the default search path.
      - name: Set LIBCLANG_PATH (macOS)
        if: runner.os == 'macOS'
        run: echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"

      # Pin the PHP that ext-php-rs builds against to the matrix version's
      # php-config, so the extension's module API matches the PHP it is loaded
      # into. setup-php puts the right php-config first on PATH, but being
      # explicit removes any ambiguity with a system php-config.
      - name: Pin PHP_CONFIG
        run: echo "PHP_CONFIG=$(command -v php-config)" >> "$GITHUB_ENV"

      - name: Build extension
        run: cargo build --release

      - name: Verify module API matches the runtime
        shell: bash
        run: |
          # The built module's API must equal the running PHP's; a mismatch is
          # exactly the "Unable to initialize module" failure we are guarding.
          ext=$(ls target/release/libsasso.dylib target/release/libsasso.so 2>/dev/null | head -1)
          out=$(php -n -d extension="$PWD/$ext" -r 'echo extension_loaded("sasso") ? "loaded\n" : "NOT loaded\n";' 2>&1)
          echo "$out"
          echo "$out" | grep -q "^loaded$"

      # phpize copies PHP's run-tests.php into the project root; setup-php
      # ships no build/ dir, so this is how the .phpt runner finds it.
      - name: Generate run-tests.php
        run: phpize

      - name: Run phpt test suite
        run: php tests/run.php
