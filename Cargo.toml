[package]
name = "sasso"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
description = "PHP extension wrapping the sasso pure-Rust SCSS → CSS compiler, built with ext-php-rs."
publish = false

[lib]
name = "sasso"
crate-type = ["cdylib"]

[dependencies]
ext-php-rs = "0.15"
# The crate that does the actual SCSS compiling is also named `sasso`; this
# package is named `sasso` too (so the PHP extension registers as `sasso`), so
# alias the dependency to `sasso_compiler` to avoid the name collision.
sasso_compiler = { package = "sasso", version = "0.6.3" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
